<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.jpeg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&display=swap"
    rel="stylesheet">
  <title>StreamSupport</title>

  <style>
    /* Loading spinner styles */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #121212;
      /* Background color */
      z-index: 9999;
      /* Ensure it is on top */
    }

    .spinner {
      border: 8px solid rgba(255, 255, 255, 0.3);
      border-top: 8px solid rgba(164, 86, 251, 1);
      /* Updated to your specified color */
      border-radius: 50%;
      width: 50px;
      /* Default size */
      height: 50px;
      /* Default size */
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .spinner {
        width: 40px;
        /* Smaller size for mobile */
        height: 40px;
        /* Smaller size for mobile */
        border-width: 6px;
        /* Slightly thinner border for better visibility */
      }
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="spinner"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Ensure spinner is displayed for a minimum time and handle both mobile and desktop
    document.addEventListener('DOMContentLoaded', function () {
      const loadingElement = document.getElementById('loading');
      const minDisplayTime = 800; // Minimum time to show spinner in milliseconds
      const startTime = Date.now();

      // Function to hide the spinner
      function hideSpinner() {
        const elapsedTime = Date.now() - startTime;
        if (elapsedTime >= minDisplayTime) {
          if (loadingElement) {
            loadingElement.style.display = 'none';
          }
        } else {
          // If minimum time hasn't elapsed, wait the remaining time
          setTimeout(hideSpinner, minDisplayTime - elapsedTime);
        }
      }

      // Hide spinner when page is fully loaded
      window.addEventListener('load', hideSpinner);

      // Fallback: hide spinner after a timeout even if load event doesn't fire
      setTimeout(hideSpinner, 5000);
    });
  </script>
</body>

</html>
